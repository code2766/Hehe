<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Made this for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbe9f1; --card:#fff8fb; --ink:#4a2340; --soft:#8a5a7e; --pop:#e8457c; --pop2:#7c5cff; --gold:#ffc24b; --night:#1d1530;
  color-scheme:light; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;overflow:hidden;transition:background .8s}
body.dim{background:#e6def5}
.stage{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:28px 22px;text-align:center;overflow:hidden}
.stage.on{display:flex;animation:in .5s ease both}
@keyframes in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
h1{font-size:clamp(28px,8vw,40px);line-height:1.15;margin:0;font-weight:600;letter-spacing:-.01em}
p{margin:0;color:var(--soft);font-size:18px;line-height:1.45;max-width:30ch}
.script{font-family:'Caveat',cursive;font-weight:700}
.btn{font:inherit;font-weight:600;font-size:18px;border:0;border-radius:999px;padding:14px 30px;background:var(--pop);color:#fff;cursor:pointer;box-shadow:0 6px 0 #b72a5a;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b72a5a}
.btn.alt{background:var(--pop2);box-shadow:0 6px 0 #4a34c0}
.btn.alt:active{box-shadow:0 2px 0 #4a34c0}
.btn[disabled]{opacity:.4;pointer-events:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.row{display:flex;gap:14px;align-items:center;justify-content:center;position:relative;min-height:60px;width:260px}
#no{position:absolute;right:0}
/* hearts floating */
.float{position:fixed;bottom:-30px;font-size:22px;opacity:.7;animation:up linear forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
/* lights */
#s1 .cord{width:4px;height:90px;background:#9a86c9;position:relative;border-radius:2px}
#s1 .bulb{position:absolute;left:50%;bottom:-34px;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:#c9bde6;border:0;cursor:pointer;transition:all .5s}
body:not(.dim) #s1 .bulb{background:var(--gold);box-shadow:0 0 60px 20px #ffc24b88}
/* bunting */
.bunting{display:flex;gap:2px;height:84px;align-items:flex-start;flex-wrap:nowrap}
.flag{width:27px;height:44px;clip-path:polygon(0 0,100% 0,50% 100%);display:flex;justify-content:center;padding-top:5px;font-weight:600;font-size:15px;color:#fff;transform:translateY(-120px) rotate(-20deg);opacity:0;transition:all .6s cubic-bezier(.3,1.5,.5,1)}
.bunting.go .flag{transform:none;opacity:1}
.gap{width:10px}
.balloon{position:fixed;bottom:-90px;width:44px;height:56px;border-radius:50% 50% 48% 48%;animation:up 6s ease-in forwards;pointer-events:none}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:34px;background:#0003}
/* garden */
.garden{position:relative;width:min(340px,100%);height:340px;cursor:pointer;border-radius:26px;background:linear-gradient(#f1fbe9,#c9edbb);overflow:hidden;border:3px solid #ffffffaa;touch-action:manipulation}
.fl{position:absolute;width:0;height:0;pointer-events:none}
.fl::after{content:"";position:absolute;left:-13px;top:-4px;width:26px;height:9px;background:#5fb866;border-radius:50%}
.stem{position:absolute;bottom:0;left:-2px;width:4px;background:linear-gradient(#4fae5c,#2f8a45);border-radius:2px;transform-origin:bottom;transform:scaleY(0);animation:grow 1.1s ease-out forwards}
@keyframes grow{to{transform:scaleY(1)}}
.leaf{position:absolute;width:18px;height:10px;background:#3f9d55;opacity:0;animation:pop .4s .7s forwards}
.leaf.a{left:2px;border-radius:0 100% 0 100%}
.leaf.b{left:-20px;border-radius:100% 0 100% 0}
@keyframes pop{to{opacity:1}}
.head{position:absolute;left:-26px;width:52px;height:52px;transform:scale(0);animation:bloom .7s 1s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes bloom{to{transform:scale(1)}}
.head i{position:absolute;left:18px;top:1px;width:16px;height:24px;border-radius:50% 50% 45% 45%;transform-origin:8px 25px}
.head b{position:absolute;left:17px;top:17px;width:18px;height:18px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #fff6}
/* cards */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(340px,100%)}
.fc{perspective:700px;height:112px;cursor:pointer;background:none;border:0;padding:0;font:inherit;color:inherit}
.fi{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s}
.fc.open .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;align-items:center;justify-content:center;padding:10px;font-size:15px;line-height:1.3}
.front{background:var(--pop2);color:#fff;font-size:34px}
.back{background:var(--card);color:var(--ink);transform:rotateY(180deg);border:2px solid var(--pop)}
/* letter */
.letter{background:var(--card);border-radius:22px;padding:24px 22px;width:min(360px,100%);text-align:left;box-shadow:0 10px 0 #0000000d;max-height:62vh;overflow:auto}
.stk{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);height:120px;transform:rotate(9deg) scale(0);transition:transform .6s cubic-bezier(.3,1.6,.5,1);pointer-events:none;filter:drop-shadow(0 4px 6px #0003)}
.stk.show{transform:rotate(9deg) scale(1)}
@media (prefers-reduced-motion: reduce){.stk{transition:none}}
.pic{display:block;width:92px;height:92px;border-radius:50%;object-fit:cover;margin:0 auto 12px;border:4px solid var(--pop);box-shadow:0 6px 0 #0000001a}
.letter .script{font-size:25px;line-height:1.35;color:var(--ink);min-height:200px;white-space:pre-wrap}
#cv{position:fixed;inset:0;pointer-events:none;z-index:9}
.mtog{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:14px;z-index:10;width:44px;height:44px;border-radius:50%;border:0;background:var(--card);color:var(--pop);font-size:20px;cursor:pointer;box-shadow:0 4px 0 #0000001a;display:none}
.mtog.show{display:block}
.mtog.on{animation:spin 4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.mtog.on{animation:none}}
@media (prefers-reduced-motion: reduce){ .stage.on{animation:none} .float,.balloon{display:none} .stem{animation:none;transform:none} .head{animation:none;transform:none} .leaf{animation:none;opacity:1} }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<audio id="aud" loop preload="auto"></audio>
<button class="mtog" id="mtog" aria-label="Pause or play music">🎵</button>

<!-- 0 intro -->
<section class="stage on" id="s0">
  <div style="font-size:54px" aria-hidden="true">💌</div>
  <h1>Hey <span id="nm1"></span>, I made you something</h1>
  <p>No birthday. No occasion. Just you.</p>
  <p style="color:var(--ink);font-weight:600">Do you wanna see?</p>
  <div class="row"><button class="btn" data-next>Yes!</button><button class="btn alt" id="no">No</button></div>
</section>

<!-- 1 lights -->
<section class="stage" id="s1">
  <h1 id="t1">It’s a little dim in here…</h1>
  <p id="p1">Pull the cord to fix that.</p>
  <button class="btn alt" id="music">🎵 Play “Yellow Paper Daisy”</button>
  <div class="cord"><button class="bulb" id="bulb" aria-label="Turn the lights on"></button></div>
  <button class="btn" data-next id="n1" style="margin-top:56px;visibility:hidden">Keep going</button>
</section>

<!-- 2 decorate -->
<section class="stage" id="s2">
  <h1>Let’s brighten the place up</h1>
  <div class="bunting" id="bunt" aria-label="Just because"></div>
  <button class="btn alt" id="deco">Decorate</button>
  <button class="btn" data-next id="n2" style="display:none">Next</button>
</section>

<!-- 3 garden -->
<section class="stage" id="s3">
  <h1>Let’s grow something</h1>
  <div class="garden" id="gd" role="button" tabindex="0" aria-label="Tap the grass to plant a flower"></div>
  <p class="hint" id="h3">Tap anywhere on the grass to plant a flower.</p>
  <button class="btn" data-next id="n3" style="display:none">Open your cards</button>
</section>

<!-- 5 cards -->
<section class="stage" id="s5">
  <h1>Tap the cards</h1>
  <div class="grid" id="grid"></div>
  <p class="hint" id="cnt">0 of 6 opened</p>
  <button class="btn" data-next id="n5" disabled>One last thing</button>
</section>

<!-- 6 letter -->
<section class="stage" id="s6">
  <h1 class="script" style="font-size:40px">For you</h1>
  <div class="letter"><img class="pic" alt="" src="assets/photo.jpg"><div class="script" id="lt" aria-live="polite"></div></div>
  <button class="btn alt" id="again">Replay</button>
  <img class="stk" id="stk" alt="" src="assets/sticker.webp">
</section>

<script>
/* ===== Edit these to personalize ===== */
var FRIEND = "Itishree";                 // her name or nickname
var FROM   = "Sanskar";         // your name
var REASONS = [
  ["🌼","You make ordinary days feel worth remembering."],
  ["🚀","Have you taken your lunch? 🚀"],
  ["🧠","You give the kind of advice I actually take."],
  ["🧟","Zombie mode or not, still my favorite person to hang out with."],
  ["🎧","You’re the first person I’d send a good song to."],
  ["🍽️","Have you washed today’s dishes? 😂"]
];
var LETTER = "Dear " + FRIEND + " (aka Zombie),\n\nNothing special happened today. I just realised I never tell you how glad I am to have you as a friend, so I’m telling you now.\n\nThank you for the laughs, the honesty, and for being easy to love. I hope someone reminds you today that you’re good at being you.\n\nI thought you wanted me to make this website so yeah !!\n\n" + "Your friend,\n" + FROM + " 🌸";
/* ===================================== */

var $=function(s){return document.querySelector(s)};
var stages=[].slice.call(document.querySelectorAll('.stage')), cur=0;
var litOn=false;
function show(n){stages[cur].classList.remove('on');cur=n;stages[cur].classList.add('on');document.body.classList.toggle('dim',n===1&&!litOn);if(stages[cur].id==='s6')typeLetter();}
document.querySelectorAll('[data-next]').forEach(function(b){b.addEventListener('click',function(){show(cur+1)})});
$('#nm1').textContent = FRIEND;

/* music: put the song file in MUSIC_SRC (a data: URI or file URL). Empty = button opens a YouTube search instead */
var MUSIC_SRC="assets/song.mp3",aud=$('#aud'),mb=$('#music'),mt=$('#mtog');
if(MUSIC_SRC)aud.src=MUSIC_SRC;
function musicUI(on){mb.textContent=on?'⏸ Pause music':'🎵 Play “Yellow Paper Daisy”';mt.classList.toggle('on',on)}
function toggleMusic(){
  if(!MUSIC_SRC){window.open('https://www.youtube.com/results?search_query=Yellow+Paper+Daisy','_blank','noopener');return}
  if(aud.paused){aud.play().then(function(){musicUI(true);mt.classList.add('show')}).catch(function(){})}
  else{aud.pause();musicUI(false)}
}
mb.addEventListener('click',toggleMusic);mt.addEventListener('click',toggleMusic);

/* hearts */
setInterval(function(){
  if(document.hidden||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var h=document.createElement('div');h.className='float';h.textContent=['💗','💖','✨','🌸'][Math.random()*4|0];
  h.style.left=Math.random()*100+'vw';h.style.animationDuration=(5+Math.random()*4)+'s';
  document.body.appendChild(h);setTimeout(function(){h.remove()},9000);
},900);

/* confetti */
var cv=$('#cv'),cx=cv.getContext('2d'),parts=[];
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener('resize',fit);
function burst(x,y,n){
  n=n||90;var cols=['#e8457c','#7c5cff','#ffc24b','#3ccfcf','#ff8fb8'];
  for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,s=3+Math.random()*7;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-5,r:Math.random()*6,c:cols[i%5],w:5+Math.random()*5,l:90+Math.random()*50});}
  if(parts.length===n)loop();
}
function loop(){
  cx.clearRect(0,0,cv.width,cv.height);
  parts=parts.filter(function(p){return p.l>0});
  parts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.vx*=.99;p.r+=.2;p.l--;
    cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/30);cx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);cx.restore();});
  if(parts.length)requestAnimationFrame(loop);else cx.clearRect(0,0,cv.width,cv.height);
}
function mid(){burst(innerWidth/2,innerHeight/2.4)}

/* 0: the "No" button runs away */
var no=$('#no');
function dodge(e){e.preventDefault();no.style.transform='translate('+((Math.random()*160-80)|0)+'px,'+((Math.random()*120-60)|0)+'px)';no.textContent=['Nope','Try again','Nice try','Just say yes'][Math.random()*4|0]}
no.addEventListener('mouseenter',dodge);no.addEventListener('click',dodge);no.addEventListener('touchstart',dodge,{passive:false});

/* 1: lights */
$('#bulb').addEventListener('click',function(){
  litOn=true;document.body.classList.remove('dim');
  $('#t1').textContent='There we go';$('#p1').textContent='Much better.';
  $('#n1').style.visibility='visible';mid();
});

/* 2: bunting + balloons */
var word="JUST BECAUSE",cols=['#e8457c','#7c5cff','#ffb13b','#2fbfbf'],bn=$('#bunt');
word.split('').forEach(function(ch,i){
  if(ch===' '){var g=document.createElement('span');g.className='gap';bn.appendChild(g);return}
  var f=document.createElement('div');f.className='flag';f.textContent=ch;f.style.background=cols[i%4];f.style.transitionDelay=(i*70)+'ms';bn.appendChild(f);
});
$('#deco').addEventListener('click',function(){
  bn.classList.add('go');this.style.display='none';
  for(var i=0;i<9;i++)(function(i){setTimeout(function(){
    var b=document.createElement('div');b.className='balloon';b.style.left=(5+Math.random()*88)+'vw';b.style.background=cols[i%4];b.style.animationDuration=(4.5+Math.random()*3)+'s';
    document.body.appendChild(b);setTimeout(function(){b.remove()},8000)},i*180)})(i);
  setTimeout(function(){$('#n2').style.display='';mid()},900);
});

/* 3: garden */
var gd=$('#gd'),planted=0,fcols=['#ff6fa3','#ffb13b','#a78bfa','#ff8a5c','#5ec8e5','#f472b6'];
function clampX(x){return Math.max(26,Math.min(gd.clientWidth-26,x))}
function clampY(y){return Math.max(165,Math.min(gd.clientHeight-14,y))}
function taken(x,y){return [].some.call(gd.querySelectorAll('.fl'),function(f){return Math.abs(f._x-x)<40&&Math.abs(f._y-y)<44})}
function plant(x,y){
  if(planted>=12)return;
  x=clampX(x);y=clampY(y);
  for(var t=0;t<30&&taken(x,y);t++){x=clampX(x+Math.random()*140-70);y=clampY(y+Math.random()*90-45)}
  planted++;
  var h=70+Math.random()*50|0,c=fcols[Math.random()*fcols.length|0];
  var f=document.createElement('div');f.className='fl';f._x=x;f._y=y;
  f.style.left=x+'px';f.style.top=y+'px';f.style.zIndex=Math.round(y);
  var petals='';for(var i=0;i<8;i++)petals+='<i style="background:'+c+';transform:rotate('+(i*45)+'deg)"></i>';
  f.innerHTML='<div class="stem" style="height:'+h+'px"><span class="leaf a" style="bottom:'+(h*.35|0)+'px"></span><span class="leaf b" style="bottom:'+(h*.55|0)+'px"></span></div><div class="head" style="bottom:'+(h-26)+'px">'+petals+'<b></b></div>';
  gd.appendChild(f);
  var r=gd.getBoundingClientRect();burst(r.left+x,r.top+y-h,18);
  if(planted===1)$('#h3').textContent='Keep going, plant a few more.';
  if(planted===5){$('#h3').textContent='Look at that.';$('#n3').style.display=''}
}
gd.addEventListener('click',function(e){var r=gd.getBoundingClientRect();plant(e.clientX-r.left,e.clientY-r.top)});
gd.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();plant(30+Math.random()*(gd.clientWidth-60),170+Math.random()*(gd.clientHeight-190))}});

/* 5: cards */
var opened=0,grid=$('#grid');
REASONS.forEach(function(r){
  var b=document.createElement('button');b.className='fc';b.setAttribute('aria-label','Open card');
  b.innerHTML='<div class="fi"><div class="face front">'+r[0]+'</div><div class="face back">'+r[1]+'</div></div>';
  b.addEventListener('click',function(){
    if(b.classList.contains('open'))return;b.classList.add('open');opened++;
    $('#cnt').textContent=opened+' of '+REASONS.length+' opened';
    if(opened===REASONS.length){$('#n5').disabled=false;mid();$('#cnt').textContent='All opened'}
  });
  grid.appendChild(b);
});

/* 6: letter */
var timer=null;
function typeLetter(){
  clearInterval(timer);$('#stk').classList.remove('show');var el=$('#lt'),i=0;el.textContent='';
  timer=setInterval(function(){el.textContent=LETTER.slice(0,++i);if(i>=LETTER.length){clearInterval(timer);burst(innerWidth/2,innerHeight/3,140);$('#stk').classList.add('show')}},32);
}
$('#again').addEventListener('click',typeLetter);
</script>
</body>
</html>
